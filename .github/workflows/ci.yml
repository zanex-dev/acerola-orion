name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (zero third-party runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps

      - name: Run security self-audit and verification suite (12/12)
        run: python -m unittest discover -s tests -v

      - name: CLI entrypoint smoke check
        run: acerola-orion --help
